# vim motions
setw -g mode-keys vi

set -g status-bg "#362820"
set -g status-fg "#b8a898"
set -sg escape-time 0

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc"
# set -ag terminal-overrides ",xterm-256color:RGB"
# set -ag terminal-overrides ",alacritty:RGB"
setw -g xterm-keys on

set-option -g history-limit 5000

# pass through <prefix-h/j/k/l> to nvim only when single pane, otherwise select pane
is_single_vim_pane="[ #{window_panes} -eq 1 ] && ps -t '#{pane_tty}' -o comm= | grep -iqE '(n?vim|view)$'"
bind h if-shell "$is_single_vim_pane" "send-keys C-b h" "select-pane -L"
bind j if-shell "$is_single_vim_pane" "send-keys C-b j" "select-pane -D"
bind k if-shell "$is_single_vim_pane" "send-keys C-b k" "select-pane -U"
bind l if-shell "$is_single_vim_pane" "send-keys C-b l" "select-pane -R"

# Set the inactive pane style (darker colors for both text and background)
set -g window-style 'fg=#999999,bg=#333333'

# Set the active pane style (brighter colors)
set -g window-active-style 'fg=#FFFFFF,bg=#111111'

# Set the pane border colors
set -g pane-border-style 'fg=colour235'
set -g pane-active-border-style 'fg=green'

# Use heavy borders for better visibility
set -g pane-border-lines heavy

# keep current working dir while splitting / opening new windows
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# pass through <prefix-B> to nvim only when single pane
bind B if-shell "$is_single_vim_pane" "send-keys C-b B" "split-window -h -c '#{pane_current_path}'"

# disable scroll through history
set -g mouse off

# pass through shift+enter for opencode
# 'always' makes tmux forward extended (CSI-u) key sequences straight
# through to the running app (nvim) instead of only using them internally
set -s extended-keys always
set -as terminal-features ',xterm-kitty:extkeys'

# let nvim's terminal queries (DA, XTGETTCAP, kitty keyboard protocol) pass
# through tmux to kitty and back cleanly, instead of tmux half-answering them
# and the responses leaking into the buffer as literal text
set -g allow-passthrough on
bind-key -n S-Enter send-keys M-Enter

# _____ PLUGINS _____

# Tmux Plugin Manager specific plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# All other plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
    set -g @continuum-restore 'on'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

